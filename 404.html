<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Áleran</title>
<meta name="description" content="Esta página no existe. Vuelve al inicio de Áleran Vocals.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0808;
    --bg-panel: #120e0e;
    --crimson: #93172c;
    --crimson-bright: #c02241;
    --whatsapp: #25D366;
    --bone: #ede7e1;
    --bone-dim: #b2a9a2;
    --muted: #7c716c;
    --line: #282020;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Work Sans', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--bone);
    font-family: var(--font-body);
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 20%, rgba(147,23,44,0.28), transparent 60%);
    pointer-events: none;
  }
  .wrap { position: relative; max-width: 480px; }
  .logo { width: 120px; margin: 0 auto 28px; opacity: 0.92; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--crimson-bright);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 18px;
  }
  .eyebrow::before, .eyebrow::after { content: ''; width: 24px; height: 1px; background: var(--crimson-bright); }
  h1 {
    font-family: var(--font-display); font-weight: 500; color: var(--bone);
    font-size: clamp(30px, 6vw, 46px); line-height: 1.15; margin-bottom: 16px;
  }
  h1 em { font-style: italic; color: var(--crimson-bright); }
  p.lede { color: var(--bone-dim); font-size: 16px; max-width: 42ch; margin: 0 auto 32px; }
  .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px; border-radius: 2px;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase;
    text-decoration: none; transition: all 0.35s var(--ease-out-expo);
  }
  .btn.filled { background: var(--crimson); color: var(--bone); border: 1px solid var(--crimson); }
  .btn.filled:hover { background: var(--crimson-bright); border-color: var(--crimson-bright); transform: translateY(-2px); }
  .btn.ghost { border: 1px solid var(--line); color: var(--bone-dim); }
  .btn.ghost:hover { border-color: var(--whatsapp); color: var(--bone); transform: translateY(-2px); }
  .code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 40px; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="logo.webp" alt="Áleran Logo" class="logo">
    <p class="eyebrow">Error 404</p>
    <h1>No encuentro <em>esa página.</em></h1>
    <p class="lede">Puede que el enlace esté roto o que la página ya no exista. Pero sí puedo ayudarte con tu voz.</p>
    <div class="actions">
      <a href="/" class="btn filled">Volver al inicio</a>
      <a href="https://wa.me/34632926726?text=Hola%20Áleran,%20llegué%20a%20una%20página%20que%20no%20encontré" target="_blank" rel="noopener" class="btn ghost">Escríbeme por WhatsApp</a>
    </div>
    <p class="code">aleranvocals.es</p>
  </div>
</body>
</html>
